<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>갓 노트</title>
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="갓 노트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="vendor/pdf.min.js"></script>
</head>
<body>

<!-- 서재 -->
<section id="library" class="view">
  <header class="topbar">
    <h1>갓 노트</h1>
    <div class="spacer"></div>
    <button id="sync-btn" class="sync-btn" title="동기화"><span class="dot"></span><span class="sync-text">로그인</span></button>
    <button id="settings-btn" class="icon-btn" title="설정" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="actions">
    <label class="big-btn primary">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15h6"/></svg>
      PDF 불러오기
      <input id="pdf-input" type="file" accept="application/pdf,.pdf" multiple hidden>
    </label>
    <button id="new-blank" class="big-btn">
      <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 9v6M9 12h6"/></svg>
      새 노트
    </button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>아직 노트가 없습니다.</p>
    <p class="muted">PDF를 불러오거나 새 노트를 만들어 보세요. 파일을 이 화면에 끌어다 놓아도 됩니다.</p>
  </div>
</section>

<!-- 편집기 -->
<section id="editor" class="view editor" hidden>
  <header class="toolbar">
    <div class="tb-left">
      <button class="icon-btn" data-act="back" aria-label="서재로">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="title"></span>
    </div>
    <div class="tb-tools">
      <button class="tool" data-tool="pen" title="펜 (P)" aria-label="펜">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path class="fillc" d="M4 20l1-5 4 4z"/></svg>
      </button>
      <button class="tool" data-tool="hl" title="형광펜 (H)" aria-label="형광펜">
        <svg viewBox="0 0 24 24"><path d="M9 14l-3 3v3h4l3-3"/><path d="M9 14l7-9 4 4-9 7z"/><rect class="fillc" x="3" y="20.5" width="18" height="2.5" rx="1" stroke="none"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="지우개 (E)" aria-label="지우개">
        <svg viewBox="0 0 24 24"><path d="M7 20h13M4.5 13.5l9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 18H8.5l-4-4a.5.5 0 0 1 0-.5z"/><path d="M9 9l6 6"/></svg>
      </button>
      <button class="tool" data-tool="text" title="텍스트 (T)" aria-label="텍스트">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
      </button>
      <button class="tool" data-tool="image" title="이미지" aria-label="이미지">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
      </button>
      <button class="tool" data-tool="select" title="선택·이동 (V)" aria-label="선택">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>
      </button>
      <input id="image-input" type="file" accept="image/*" hidden>
    </div>
    <div class="tb-right">
      <button class="icon-btn" data-act="undo" title="실행 취소" aria-label="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="icon-btn" data-act="redo" title="다시 실행" aria-label="다시 실행"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="icon-btn" data-act="pen-only" title="손가락 필기 끄기 (애플펜슬로만 필기, 손가락은 스크롤)" aria-label="손가락 필기 끄기">
        <svg viewBox="0 0 24 24"><path d="M9 12V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7l-2.2-3.6a1.5 1.5 0 0 1 2.5-1.6L9 15"/><path d="M3 3l18 18" class="slash"/></svg>
      </button>
      <button class="icon-btn" data-act="hide-ui" title="메뉴 숨기기 (F)" aria-label="메뉴 숨기기"><svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      <button class="icon-btn" data-act="more" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
  </header>
  <div class="tool-options" hidden></div>
  <div class="more-menu" hidden>
    <button data-act="add-page">현재 페이지 뒤에 빈 페이지 추가</button>
    <label class="menu-row">새 페이지 종이
      <select>
        <option value="plain">무지</option>
        <option value="lined">줄 노트</option>
        <option value="grid">모눈</option>
        <option value="dot">점 노트</option>
      </select>
    </label>
    <button data-act="rename">노트 이름 바꾸기</button>
    <button data-act="del-page" class="danger">현재 페이지 삭제</button>
  </div>
  <div class="selbar" hidden>
    <div class="size-ctrl">
      <button data-act="size-down" aria-label="글자 작게">A<small>−</small></button>
      <span class="size-val">18</span>
      <button data-act="size-up" aria-label="글자 크게">A<small>+</small></button>
    </div>
    <button data-act="edit">편집</button>
    <button data-act="delete" class="danger">삭제</button>
  </div>
  <div class="float-bar" hidden>
    <button data-act="undo-float" aria-label="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button data-act="show-ui" aria-label="메뉴 보이기" title="메뉴 보이기 (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="pages"><div class="pages-inner"></div></div>
  <div class="statusbar">
    <span class="page-label"></span>
    <div class="zoom">
      <button data-act="zoom-out" aria-label="축소">−</button>
      <button class="zoom-label" title="화면 맞춤">100%</button>
      <button data-act="zoom-in" aria-label="확대">+</button>
    </div>
    <span class="save-state"></span>
  </div>
</section>

<!-- 설정 -->
<dialog id="settings" class="sheet">
  <form method="dialog">
    <h2>설정 · 동기화</h2>
    <div id="account-box"></div>
    <details id="client-details">
      <summary>구글 OAuth 클라이언트 ID</summary>
      <p class="muted small">처음 한 번만 필요합니다. 만드는 방법은 README를 참고하세요.</p>
      <input id="client-id" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
      <button type="button" id="save-client" class="btn">저장</button>
    </details>
    <p class="muted small">노트는 이 기기에 먼저 저장되고, 구글 드라이브의 <b>갓 노트</b> 폴더와 자동으로 동기화됩니다. 같은 노트를 두 기기에서 동시에 고치면 나중에 저장된 쪽이 남습니다.</p>
    <div class="row-end"><button class="btn">닫기</button></div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<div id="drop" class="drop" hidden>PDF를 놓으면 불러옵니다</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
